name: Feature Request
description: Propose a new feature or improvement for InvoFi
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check the [roadmap in the README](../README.md#roadmap) to see if this is already planned.

  - type: input
    id: title
    attributes:
      label: Feature title
      placeholder: "e.g. Secondary market for position tokens, or CSV export of portfolio history"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (Next.js)
        - SDK (@invofi/sdk)
        - Auth / Wallet
        - Documentation
        - Infrastructure / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: What current limitation or pain point does this address?
      placeholder: "Right now, the marketplace has no pagination — browsing more than a few dozen invoices gets slow."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you want built.
      placeholder: "Add pagination (or infinite scroll) to the marketplace query so it stays fast as the invoice count grows."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: "We could build this in the frontend only, but doing it in the protocol keeps it trustless and auditable."

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not been requested before.
          required: true
        - label: This is not in the existing roadmap (or I want to prioritize it sooner).
          required: true
