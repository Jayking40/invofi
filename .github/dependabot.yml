version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/invofi/apps/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(frontend)"

  - package-ecosystem: "cargo"
    directory: "/invofi/apps/contracts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(contracts)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
