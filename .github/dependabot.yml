version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/invofi/apps/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(frontend)"
    ignore:
      # Major bumps need a deliberate migration (breaking API/config changes),
      # not an automated PR — see React 18->19, ESLint 8->9 /
      # eslint-config-next, and Tailwind 3->4, which are each pinned here for
      # a reason. Dependabot still proposes minor/patch updates.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Cargo dependency updates moved to Stellar-VaultLink/invofi-contracts
  # (the contracts repo owns its own dependabot config) as part of the
  # two-repo topology migration.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
